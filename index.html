<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>edenangels</title>
<style>
  :root { --bg: #f6f3ea; --panel: #fbfaf5; --text: #2a332c; --text-2: #6f786e; --green: #4f7f5a; --line: #e9e4d7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141b16; --panel: #1b241e; --text: #e7ebe0; --text-2: #94a194; --green: #6fa27b; --line: #27322a; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; padding: 24px 16px; }
  main { width: 100%; max-width: 360px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px 4px; color: var(--text-2); letter-spacing: .02em; }
  a.app { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none; }
  a.app + a.app { margin-top: 10px; }
  a.app svg { width: 44px; height: 44px; flex: none; }
  a.app b { display: block; font-size: 18px; }
  a.app span { color: var(--text-2); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>edenangels</h1>
  <!-- One entry per app. Each app lives in its own folder of this site. -->
  <a class="app" href="/chat/">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#4f7f5b"/><path d="M256 104c-88 0-160 64-160 144 0 36 15 69 40 94l-18 66 74-24c20 8 41 12 64 12 88 0 160-64 160-148s-72-144-160-144z" fill="#fff"/><path d="M190 300c0-66 44-110 132-116 0 82-40 128-104 128-10 0-20-4-28-12z" fill="#4f7f5b"/><path d="M196 318c26-44 58-74 100-100" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg>
    <div><b>EdenChat</b><span>/chat</span></div>
  </a>
</main>
</body>
</html>
